<svg xmlns="http://www.w3.org/2000/svg" width="760" height="476" viewBox="0 0 760 476" role="img" aria-labelledby="title desc">
<title id="title">The three intended outcomes in the bigger picture</title>
<desc id="desc">A Salmon Data Package reuses terms from shared ontologies and vocabularies (outcome 2, Day 1) and publishes its metadata to public catalogs and databases (outcome 1, Day 1). Its local meanings go into an organization's own vocabulary and ontology (Day 2), which bridges local terms to shared meanings (outcome 3, Day 2) and proposes new shared terms (outcome 2, Day 2) that later packages can reuse.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334755"/></marker></defs>
<rect width="760" height="476" rx="8" fill="#ffffff"/>
<text x="24" y="34" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#172b3a">Three outcomes in the bigger picture</text>
<rect x="250" y="60" width="260" height="72" rx="7" fill="#f4f5f6" stroke="#687582"/>
<text x="380.0" y="91.0" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#172b3a">Shared ontologies</text>
<text x="380.0" y="113.0" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#172b3a">and vocabularies</text>
<rect x="20" y="212" width="260" height="94" rx="7" fill="#f4f5f6" stroke="#687582"/>
<text x="150.0" y="243.0" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#172b3a">Salmon Data Package</text>
<text x="150.0" y="265.0" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#172b3a">data + metadata</text>
<text x="150.0" y="287.0" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#172b3a">using standard terms</text>
<rect x="480" y="212" width="260" height="94" rx="7" fill="#f4f5f6" stroke="#687582"/>
<text x="610.0" y="243.0" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#172b3a">Local vocabulary</text>
<text x="610.0" y="265.0" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#172b3a">and ontology</text>
<text x="610.0" y="287.0" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#172b3a">your organization&#x27;s terms</text>
<rect x="20" y="384" width="260" height="72" rx="7" fill="#f4f5f6" stroke="#687582"/>
<text x="150.0" y="415.0" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#172b3a">Public catalogs</text>
<text x="150.0" y="437.0" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#172b3a">and databases</text>
