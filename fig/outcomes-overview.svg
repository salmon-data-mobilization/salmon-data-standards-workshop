<circle cx="174" cy="150" r="11" fill="#334755"/>
<text x="174" y="155" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text>
<text x="192" y="156" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#172b3a">reuse terms</text>
<text x="192" y="178" font-family="sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#4a5a66">Day 1</text>
