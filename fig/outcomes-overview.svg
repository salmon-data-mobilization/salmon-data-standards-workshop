<text x="362" y="408" font-family="sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#172b3a">Reusable data publication</text>
<circle cx="344" cy="428" r="11" fill="#334755"/>
<text x="344" y="433" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text>
<text x="362" y="434" font-family="sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#172b3a">Contribution to shared terminology</text>
<circle cx="344" cy="454" r="11" fill="#334755"/>
<text x="344" y="459" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text>
<text x="362" y="460" font-family="sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#172b3a">Local stewardship connected to shared meanings</text>
