name: Workshop preview publish

on:
  workflow_run:
    workflows: [Workshop preview build]
    types: [completed]

permissions: {}

concurrency:
  group: workshop-preview-publish-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.repository.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    # REQUIRED SETUP: selected deployment branches = main ONLY, no tags.
    # Keep the Netlify token solely in this environment, never repo secrets.
    environment: workshop-preview-publisher
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Check out trusted publisher from the default branch event SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # workflow_run GITHUB_SHA is the default branch, not the PR head.
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
          sparse-checkout: scripts/publish-review-preview.py
          sparse-checkout-cone-mode: false

      - name: Validate and publish static preview
        env:
          GH_TOKEN: ${{ github.token }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
          NETLIFY_SITE_NAME: ${{ vars.NETLIFY_SITE_NAME }}
        # No dependency installation, artifact extraction, PR checkout, cache,
        # shelling out to Netlify CLI, or evaluation of artifact config.
        run: python3 -I trusted/scripts/publish-review-preview.py
