      <rect x="53" y="193" width="296" height="9" rx="5" fill="#EFF8FB" stroke="#EFF8FB" stroke-width="0" />
      <circle cx="201.0" cy="296" r="77" fill="#EFF8FB" stroke="none" stroke-width="0" />
      <g transform="translate(142,237) scale(0.98)" aria-label="dictionary icon">
        <path d="M30 15 H77 L92 30 V105 H30 Z" fill="none" stroke="#20384C" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M77 15 V31 H92" fill="none" stroke="#20384C" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M41 48 H80" fill="none" stroke="#617988" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M41 62 H80" fill="none" stroke="#167EAB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M41 76 H71" fill="none" stroke="#617988" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M41 90 H71" fill="none" stroke="#167EAB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      </g>
      <path d="M68 395 H334" fill="none" stroke="#BBDCE8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
