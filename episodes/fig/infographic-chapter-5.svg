      <text x="999.0" y="430" font-size="23" font-weight="710" fill="#20384C" text-anchor="middle">Review decisions</text>
      <text x="999.0" y="454" font-size="16" font-weight="460" fill="#617988" text-anchor="middle">Accept, reject, or question</text>
