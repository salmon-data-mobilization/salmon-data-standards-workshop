      <rect x="851" y="193" width="296" height="9" rx="5" fill="#EFF8FB" stroke="#EFF8FB" stroke-width="0" />
      <circle cx="999.0" cy="296" r="77" fill="#EFF8FB" stroke="none" stroke-width="0" />
      <g transform="translate(940,237) scale(0.98)" aria-label="compare icon">
        <rect x="7" y="24" width="48" height="72" rx="7" fill="white" stroke="#167EAB" stroke-width="3" />
        <rect x="65" y="24" width="48" height="72" rx="7" fill="white" stroke="#CB7842" stroke-width="3" />
        <path d="M17 43 H45 M75 43 H103" fill="none" stroke="#617988" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M17 57 H45 M75 57 H103" fill="none" stroke="#617988" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M17 71 H45 M75 71 H103" fill="none" stroke="#617988" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
