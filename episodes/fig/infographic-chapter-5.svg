        <path d="M71 69 L103 103" fill="none" stroke="#20384C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M37 47 H65 M37 59 H58" fill="none" stroke="#167EAB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
