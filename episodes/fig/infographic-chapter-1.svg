<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Chapter 1: See the Whole Journey: From NuSEDS to Reusable Data</title>
  <desc id="svg-desc">Minimal flowchart line illustration for workshop Chapter 1. NuSEDS source, Human context, Reusable data. White background.</desc>
  <style>
