<svg xmlns="http://www.w3.org/2000/svg" width="760" height="632" viewBox="0 0 760 632" role="img" aria-labelledby="title desc">
<title id="title">Drawing convention: a skeleton for one variable</title>
<desc id="desc">A template with no dataset values. A variable box holds your label and the source field name. Solid arrows labelled concerns, represents and has constraint point to entity, property and constraint boxes, which ask what the variable is about, what is measured and what narrows it. A dashed arrow labelled has constraint? points to a dashed question box for a possible constraint that needs evidence. Below, an activity box applies the variable, uses a method and generates a result: one example value and its unit. A legend explains solid arrows, dashed arrows and boxes.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334755"/></marker></defs>
<rect width="760" height="632" rx="8" fill="#ffffff"/>
<text x="24" y="34" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#172b3a">Drawing convention: one variable</text>
<text x="24" y="60" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#172b3a">A template, not an answer: replace each question with your own label.</text>
<rect x="20" y="84" width="165" height="80" rx="7" fill="#f4f5f6" stroke="#687582"/>
<text x="102.5" y="119.0" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#172b3a">ENTITY</text>
<text x="102.5" y="141.0" font-family="sans-serif" font-size="15" font-weight="normal" font-style="italic" text-anchor="middle" fill="#172b3a">What is it about?</text>
<rect x="205" y="84" width="165" height="80" rx="7" fill="#f4f5f6" stroke="#687582"/>
<text x="287.5" y="119.0" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#172b3a">PROPERTY</text>
<text x="287.5" y="141.0" font-family="sans-serif" font-size="15" font-weight="normal" font-style="italic" text-anchor="middle" fill="#172b3a">What is measured?</text>
<rect x="390" y="84" width="165" height="80" rx="7" fill="#f4f5f6" stroke="#687582"/>
<text x="472.5" y="119.0" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#172b3a">CONSTRAINT</text>
<text x="472.5" y="141.0" font-family="sans-serif" font-size="15" font-weight="normal" font-style="italic" text-anchor="middle" fill="#172b3a">What narrows it?</text>
<rect x="575" y="84" width="165" height="80" rx="7" fill="#f4f5f6" stroke="#687582" stroke-dasharray="6 4"/>
<text x="657.5" y="108.0" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#172b3a">QUESTION</text>
<text x="657.5" y="130.0" font-family="sans-serif" font-size="15" font-weight="normal" font-style="italic" text-anchor="middle" fill="#172b3a">Constraint?</text>
<text x="657.5" y="152.0" font-family="sans-serif" font-size="15" font-weight="normal" font-style="italic" text-anchor="middle" fill="#172b3a">Evidence needed</text>
<rect x="20" y="236" width="720" height="84" rx="7" fill="#f4f5f6" stroke="#687582"/>
<text x="380.0" y="262.0" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#172b3a">VARIABLE</text>
<text x="380.0" y="284.0" font-family="sans-serif" font-size="15" font-weight="normal" font-style="italic" text-anchor="middle" fill="#172b3a">Your label for the column</text>
<text x="380.0" y="306.0" font-family="sans-serif" font-size="15" font-weight="normal" font-style="italic" text-anchor="middle" fill="#172b3a">Source field name</text>
<path d="M 103 235 V 165" fill="none" stroke="#334755" stroke-width="2" marker-end="url(#arrow)"/>
<text x="95" y="206" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="end" fill="#172b3a">concerns</text>
<path d="M 288 235 V 165" fill="none" stroke="#334755" stroke-width="2" marker-end="url(#arrow)"/>
<text x="280" y="206" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="end" fill="#172b3a">represents</text>
<path d="M 473 235 V 165" fill="none" stroke="#334755" stroke-width="2" marker-end="url(#arrow)"/>
<text x="465" y="206" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="end" fill="#172b3a">has constraint</text>
<path d="M 658 235 V 165" fill="none" stroke="#334755" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="650" y="206" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="end" fill="#172b3a">has constraint?</text>
<rect x="20" y="392" width="170" height="86" rx="7" fill="#f4f5f6" stroke="#687582"/>
<text x="105.0" y="430.0" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#172b3a">METHOD</text>
<text x="105.0" y="452.0" font-family="sans-serif" font-size="15" font-weight="normal" font-style="italic" text-anchor="middle" fill="#172b3a">Which procedure?</text>
<rect x="290" y="392" width="180" height="86" rx="7" fill="#f4f5f6" stroke="#687582"/>
<text x="380.0" y="419.0" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#172b3a">ACTIVITY</text>
<text x="380.0" y="441.0" font-family="sans-serif" font-size="15" font-weight="normal" font-style="italic" text-anchor="middle" fill="#172b3a">How was the</text>
<text x="380.0" y="463.0" font-family="sans-serif" font-size="15" font-weight="normal" font-style="italic" text-anchor="middle" fill="#172b3a">value obtained?</text>
<rect x="570" y="392" width="170" height="86" rx="7" fill="#f4f5f6" stroke="#687582"/>
<text x="655.0" y="419.0" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#172b3a">RESULT</text>
<text x="655.0" y="441.0" font-family="sans-serif" font-size="15" font-weight="normal" font-style="italic" text-anchor="middle" fill="#172b3a">One example value</text>
<text x="655.0" y="463.0" font-family="sans-serif" font-size="15" font-weight="normal" font-style="italic" text-anchor="middle" fill="#172b3a">Unit?</text>
<path d="M 380 391 V 321" fill="none" stroke="#334755" stroke-width="2" marker-end="url(#arrow)"/>
<text x="390" y="362" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#172b3a">applies variable</text>
<path d="M 289 435 H 191" fill="none" stroke="#334755" stroke-width="2" marker-end="url(#arrow)"/>
<text x="240" y="410" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#172b3a">uses</text>
<text x="240" y="428" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#172b3a">method</text>
<path d="M 471 435 H 569" fill="none" stroke="#334755" stroke-width="2" marker-end="url(#arrow)"/>
<text x="520" y="410" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#172b3a">generates</text>
<text x="520" y="428" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#172b3a">result</text>
<path d="M 24 522 H 79" fill="none" stroke="#334755" stroke-width="2" marker-end="url(#arrow)"/>
<text x="94" y="528" font-family="sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#172b3a">Solid arrow + verb phrase: a working statement you can read as a sentence.</text>
<path d="M 24 556 H 79" fill="none" stroke="#334755" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="94" y="562" font-family="sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#172b3a">Dashed arrow + question mark: a relationship that still needs evidence.</text>
<rect x="24" y="578" width="55" height="30" rx="5" fill="#f4f5f6" stroke="#687582"/>
<text x="94" y="598" font-family="sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#172b3a">Box: one idea, with its role, your label and a source field or example.</text>
</svg>
