        <path d="M76 47 Q69 60 77 72" fill="none" stroke="#20384C" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round" />
        <circle cx="85" cy="56" r="2.8" fill="#20384C" stroke="#20384C" stroke-width="1" />
