    <text x="126" y="70" font-size="34" font-weight="730" fill="#20384C" text-anchor="start">Draw the Dataset Before Using Tools</text>
    <rect x="1022" y="38" width="138" height="42" rx="21" fill="#EFF8FB" stroke="#BBDCE8" stroke-width="2" />
    <text x="1091" y="66" font-size="20" font-weight="720" fill="#167EAB" text-anchor="middle">DAY 1</text>
    <path d="M40 139 H1160" fill="none" stroke="#BBDCE8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <text x="41" y="519" font-size="22" font-weight="470" fill="#617988" text-anchor="start">Draw relationships before choosing tools or terminology.</text>
