<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Chapter 7: Validate, Inspect the Test Record, and Explain Publication</title>
  <desc id="svg-desc">Minimal flowchart line illustration for workshop Chapter 7. Data package, Validate &amp; export, Inspect test record. White background.</desc>
  <style>
