<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Chapter 12: Draft a Term Request and Follow Its Stewardship</title>
  <desc id="svg-desc">Minimal flowchart line illustration for workshop Chapter 12. Draft request, Human review, Stewardship. White background.</desc>
  <style>
    /* Font for all text in this image. To use a different font for one piece of text,
       give that text element its own font-family attribute. */
    svg { font-family: 'DejaVu Sans', 'Arial', sans-serif; }
  </style>
  <!-- White background: keeps the drawing readable on the site's dark theme -->
  <rect id="background" x="0" y="0" width="1200" height="560" rx="20" fill="#FFFFFF" />
  <g stroke-linecap="round" stroke-linejoin="round">
    <desc>Draft a Term Request and Follow Its Stewardship. White background, pure vector paths and text.</desc>
    <circle cx="68" cy="70" r="38" fill="#CB7842" stroke="#CB7842" stroke-width="0" />
    <text x="68" y="85" font-size="39" font-weight="750" fill="white" text-anchor="middle">12</text>
    <text x="126" y="54" font-size="31" font-weight="720" fill="#20384C" text-anchor="start">Draft a Term Request and</text>
    <text x="126" y="93" font-size="31" font-weight="720" fill="#20384C" text-anchor="start">Follow Its Stewardship</text>
    <rect x="1022" y="38" width="138" height="42" rx="21" fill="#FFF5EE" stroke="#F0D4C2" stroke-width="2" />
    <text x="1091" y="66" font-size="20" font-weight="720" fill="#CB7842" text-anchor="middle">DAY 2</text>
    <path d="M40 139 H1160" fill="none" stroke="#F0D4C2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <text x="41" y="519" font-size="22" font-weight="470" fill="#617988" text-anchor="start">Submitting a draft is not the same as approval.</text>
    <path d="M380 314 H418" fill="none" stroke="#CB7842" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M405 304 L418 314 L405 324" fill="none" stroke="#CB7842" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M779 314 H817" fill="none" stroke="#CB7842" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M804 304 L817 314 L804 324" fill="none" stroke="#CB7842" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round" />
    <g id="chapter-12-stage-1" aria-label="Draft request">
      <rect x="37" y="178" width="328" height="284" rx="22" fill="white" stroke="#F0D4C2" stroke-width="2.7" />
      <rect x="53" y="193" width="296" height="9" rx="5" fill="#FFF5EE" stroke="#FFF5EE" stroke-width="0" />
      <circle cx="201.0" cy="296" r="77" fill="#FFF5EE" stroke="none" stroke-width="0" />
      <g transform="translate(142,237) scale(0.98)" aria-label="request icon">
        <path d="M28 16 H77 L94 34 V106 H28 Z M77 16 V34 H94" fill="none" stroke="#20384C" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M39 48 H80 M39 61 H76 M39 74 H81" fill="none" stroke="#617988" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M61 98 L72 88 L79 96 L94 79" fill="none" stroke="#167EAB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      </g>
      <path d="M68 395 H334" fill="none" stroke="#F0D4C2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="201.0" y="430" font-size="23" font-weight="710" fill="#20384C" text-anchor="middle">Draft request</text>
      <text x="201.0" y="454" font-size="16" font-weight="460" fill="#617988" text-anchor="middle">State the proposed meaning</text>
    </g>
    <g id="chapter-12-stage-2" aria-label="Human review">
      <rect x="436" y="178" width="328" height="284" rx="22" fill="white" stroke="#CB7842" stroke-width="3.4" />
      <rect x="452" y="193" width="296" height="9" rx="5" fill="#FFF5EE" stroke="#FFF5EE" stroke-width="0" />
      <circle cx="600.0" cy="296" r="77" fill="#FFF5EE" stroke="none" stroke-width="0" />
      <g transform="translate(541,237) scale(0.98)" aria-label="review icon">
        <rect x="25" y="17" width="73" height="92" rx="8" fill="white" stroke="#20384C" stroke-width="3.5" />
        <rect x="48" y="11" width="26" height="12" rx="3" fill="#EFF8FB" stroke="#20384C" stroke-width="3" />
        <path d="M36 43 l6 6 l10 -12" fill="none" stroke="#378967" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M60 45 H85" fill="none" stroke="#617988" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M36 67 l6 6 l10 -12" fill="none" stroke="#378967" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M60 69 H85" fill="none" stroke="#617988" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M36 91 l6 6 l10 -12" fill="none" stroke="#378967" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M60 93 H85" fill="none" stroke="#617988" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      </g>
      <path d="M467 395 H733" fill="none" stroke="#F0D4C2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="600.0" y="430" font-size="23" font-weight="710" fill="#20384C" text-anchor="middle">Human review</text>
      <text x="600.0" y="454" font-size="16" font-weight="460" fill="#617988" text-anchor="middle">Discuss and refine evidence</text>
    </g>
    <g id="chapter-12-stage-3" aria-label="Stewardship">
      <rect x="835" y="178" width="328" height="284" rx="22" fill="white" stroke="#F0D4C2" stroke-width="2.7" />
      <rect x="851" y="193" width="296" height="9" rx="5" fill="#FFF5EE" stroke="#FFF5EE" stroke-width="0" />
      <circle cx="999.0" cy="296" r="77" fill="#FFF5EE" stroke="none" stroke-width="0" />
      <g transform="translate(940,237) scale(0.98)" aria-label="version icon">
        <path d="M85 31 C55 6 20 27 24 63" fill="none" stroke="#167EAB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M16 52 L24 66 L39 57" fill="none" stroke="#167EAB" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M35 88 C67 115 100 86 96 52" fill="none" stroke="#CB7842" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M103 62 L96 49 L82 59" fill="none" stroke="#CB7842" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M45 48 H76 M45 61 H70" fill="none" stroke="#617988" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      </g>
      <path d="M866 395 H1132" fill="none" stroke="#F0D4C2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="999.0" y="430" font-size="23" font-weight="710" fill="#20384C" text-anchor="middle">Stewardship</text>
      <text x="999.0" y="454" font-size="16" font-weight="460" fill="#617988" text-anchor="middle">Track decisions and versions</text>
    </g>
  </g>
</svg>
