      <text x="600.0" y="454" font-size="16" font-weight="460" fill="#617988" text-anchor="middle">Use evidence, not guesses</text>
    </g>
    <g id="chapter-6-stage-3" aria-label="Route decisions">
      <rect x="835" y="178" width="328" height="284" rx="22" fill="white" stroke="#BBDCE8" stroke-width="2.7" />
      <rect x="851" y="193" width="296" height="9" rx="5" fill="#EFF8FB" stroke="#EFF8FB" stroke-width="0" />
      <circle cx="999.0" cy="296" r="77" fill="#EFF8FB" stroke="none" stroke-width="0" />
      <g transform="translate(940,237) scale(0.98)" aria-label="branch icon">
        <rect x="40" y="14" width="40" height="23" rx="7" fill="#EFF8FB" stroke="#20384C" stroke-width="3.5" />
        <path d="M60 37 V53 M22 53 H98 M22 53 V77 M60 53 V77 M98 53 V77" fill="none" stroke="#20384C" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round" />
        <rect x="7" y="77" width="30" height="25" rx="6" fill="white" stroke="#378967" stroke-width="3" />
        <rect x="45" y="77" width="30" height="25" rx="6" fill="white" stroke="#167EAB" stroke-width="3" />
        <rect x="83" y="77" width="30" height="25" rx="6" fill="white" stroke="#CB7842" stroke-width="3" />
      </g>
      <path d="M866 395 H1132" fill="none" stroke="#BBDCE8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="999.0" y="430" font-size="23" font-weight="710" fill="#20384C" text-anchor="middle">Route decisions</text>
      <text x="999.0" y="454" font-size="16" font-weight="460" fill="#617988" text-anchor="middle">Reuse, local, or unresolved</text>
    </g>
