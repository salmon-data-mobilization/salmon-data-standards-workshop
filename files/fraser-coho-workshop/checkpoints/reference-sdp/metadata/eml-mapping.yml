methods:
- description: Source records report spawner estimates and ESTIMATE_METHOD; methods
    vary among records. The 173-row teaching slice is derived by the pinned metasalmon
    script. The official dictionary defines the adult field as mature salmon excluding
    jacks; natural origin is not inferred. Working semantic selections are agent-authored
    and await independent scientific review.
