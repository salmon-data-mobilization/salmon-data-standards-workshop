<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1270" role="img" aria-labelledby="title description">
<title id="title">Fraser Coho dataset conceptual graph, draft for scientific review</title>
<desc id="description">A source record refers to a population, names a waterbody, carries species and an estimate year. An estimation activity applies a variable, uses a method and can generate a result. The variable represents abundance and has scope questions. A result is expressed in individuals according to the starter dictionary. Conservation Unit membership is an unconnected review question. Complete node and edge tables retain evidence and uncertainty.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4b5563"/></marker></defs>
<rect width="1400" height="1270" fill="#ffffff"/>
<g font-family="Arial, sans-serif" fill="#172b35">
<text x="45" y="45" font-size="28" font-weight="700">Fraser Coho: draw the meaning before using tools</text>
<text x="45" y="78" font-size="18">DRAFT working model · not a scientifically approved answer key or formal OWL</text>
<text x="45" y="120" font-size="21" font-weight="700">A. What a source record refers to</text>

<rect x="45" y="155" width="300" height="82" rx="8" fill="#edf5f5" stroke="#3f6d73" stroke-width="2"/>
<text x="195.0" y="183" text-anchor="middle" font-size="18" font-weight="700">N2 · Source population</text>
<text x="195.0" y="207" text-anchor="middle" font-size="16" font-weight="400">POP_ID / POPULATION</text>
<rect x="1055" y="155" width="300" height="82" rx="8" fill="#edf5f5" stroke="#3f6d73" stroke-width="2"/>
<text x="1205.0" y="183" text-anchor="middle" font-size="18" font-weight="700">N3 · Waterbody or portion</text>
<text x="1205.0" y="207" text-anchor="middle" font-size="16" font-weight="400">WATERBODY / WATERSHED_CDE</text>
<rect x="540" y="245" width="320" height="88" rx="8" fill="#edf5f5" stroke="#3f6d73" stroke-width="2"/>
<text x="700.0" y="273" text-anchor="middle" font-size="18" font-weight="700">N1 · Source record</text>
<text x="700.0" y="297" text-anchor="middle" font-size="16" font-weight="400">173 rows; 164 population–year pairs</text>
<rect x="45" y="345" width="300" height="82" rx="8" fill="#edf5f5" stroke="#3f6d73" stroke-width="2"/>
<text x="195.0" y="373" text-anchor="middle" font-size="18" font-weight="700">N4 · Species designation</text>
<text x="195.0" y="397" text-anchor="middle" font-size="16" font-weight="400">SPECIES: Coho in this slice</text>
<rect x="1055" y="345" width="300" height="82" rx="8" fill="#edf5f5" stroke="#3f6d73" stroke-width="2"/>
<text x="1205.0" y="373" text-anchor="middle" font-size="18" font-weight="700">N5 · Year estimate is for</text>
<text x="1205.0" y="397" text-anchor="middle" font-size="16" font-weight="400">ANALYSIS_YR: 2023 or 2024</text>
<path d="M540,267 L445,267 L445,196 L345,196" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
<text x="441" y="247" text-anchor="middle" font-size="16" fill="#334155">refers to</text>
<path d="M860,267 L965,267 L965,196 L1055,196" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
<text x="958" y="247" text-anchor="middle" font-size="16" fill="#334155">names</text>
<path d="M540,308 L445,308 L445,386 L345,386" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
<text x="443" y="407" text-anchor="middle" font-size="16" fill="#334155">carries species</text>
<path d="M860,308 L965,308 L965,386 L1055,386" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
<text x="960" y="407" text-anchor="middle" font-size="16" fill="#334155">carries estimate year</text>
<text x="45" y="465" font-size="16">A repeated population–year pair is retained; the diagram does not declare a unique row key.</text>
<line x1="45" y1="495" x2="1355" y2="495" stroke="#cad5da"/>
<text x="45" y="535" font-size="21" font-weight="700">B. Expand the estimate: variable, activity and result are different things</text>
<rect x="45" y="575" width="330" height="94" rx="8" fill="#edf5f5" stroke="#3f6d73" stroke-width="2"/>
<text x="210.0" y="603" text-anchor="middle" font-size="18" font-weight="700">N6 · Adult-spawner variable</text>
<text x="210.0" y="627" text-anchor="middle" font-size="16" font-weight="400">NATURAL_ADULT_SPAWNERS</text>
<text x="210.0" y="651" text-anchor="middle" font-size="16" font-weight="400">Source scope needs review</text>
<rect x="540" y="575" width="320" height="94" rx="8" fill="#edf5f5" stroke="#3f6d73" stroke-width="2"/>
<text x="700.0" y="603" text-anchor="middle" font-size="18" font-weight="700">N8 · Estimation activity</text>
<text x="700.0" y="627" text-anchor="middle" font-size="16" font-weight="400">Exact activity grain needs review</text>
<text x="700.0" y="651" text-anchor="middle" font-size="16" font-weight="400">Not necessarily one field visit</text>
<rect x="1030" y="575" width="325" height="94" rx="8" fill="#edf5f5" stroke="#3f6d73" stroke-width="2"/>
<text x="1192.5" y="603" text-anchor="middle" font-size="18" font-weight="700">N11 · Method value</text>
<text x="1192.5" y="627" text-anchor="middle" font-size="16" font-weight="400">ESTIMATE_METHOD</text>
<text x="1192.5" y="651" text-anchor="middle" font-size="16" font-weight="400">Row-specific source label</text>
<path d="M540,622 L375,622" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
<text x="457" y="608" text-anchor="middle" font-size="16" fill="#334155">applies</text>
<path d="M860,622 L1030,622" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
<text x="945" y="608" text-anchor="middle" font-size="16" fill="#334155">uses source method</text>
<rect x="45" y="745" width="330" height="82" rx="8" fill="#edf5f5" stroke="#3f6d73" stroke-width="2"/>
<text x="210.0" y="773" text-anchor="middle" font-size="18" font-weight="700">N7 · Abundance</text>
<text x="210.0" y="797" text-anchor="middle" font-size="16" font-weight="400">Working property interpretation</text>
<rect x="540" y="745" width="320" height="94" rx="8" fill="#edf5f5" stroke="#3f6d73" stroke-width="2"/>
<text x="700.0" y="773" text-anchor="middle" font-size="18" font-weight="700">N9 · Reported result</text>
<text x="700.0" y="797" text-anchor="middle" font-size="16" font-weight="400">Number when reported</text>
<text x="700.0" y="821" text-anchor="middle" font-size="16" font-weight="400">Example value: 758</text>
<rect x="1030" y="745" width="325" height="94" rx="8" fill="#edf5f5" stroke="#3f6d73" stroke-width="2"/>
<text x="1192.5" y="773" text-anchor="middle" font-size="18" font-weight="700">N10 · Individuals</text>
<text x="1192.5" y="797" text-anchor="middle" font-size="16" font-weight="400">Starter dictionary unit</text>
<text x="1192.5" y="821" text-anchor="middle" font-size="16" font-weight="400">Confirm estimate interpretation</text>
<path d="M210,669 L210,745" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
<text x="210" y="714" text-anchor="middle" font-size="16" fill="#334155">represents characteristic</text>
<path d="M700,669 L700,745" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
<text x="700" y="712" text-anchor="middle" font-size="16" fill="#334155">can generate</text>
<path d="M860,792 L1030,792" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
<text x="945" y="779" text-anchor="middle" font-size="16" fill="#334155">uses unit</text>
<rect x="45" y="925" width="465" height="102" rx="8" fill="#fff8e7" stroke="#986b1b" stroke-width="2" stroke-dasharray="8 5"/>
<text x="277.5" y="953" text-anchor="middle" font-size="18" font-weight="700">N13 · Scope questions</text>
<text x="277.5" y="977" text-anchor="middle" font-size="16" font-weight="400">Current definition: mature adults excluding jacks</text>
<text x="277.5" y="1001" text-anchor="middle" font-size="16" font-weight="400">Natural-origin restriction is not established</text>
<path d="M45,622 L20,622 L20,894 L278,894 L278,925" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
<text x="160" y="883" text-anchor="middle" font-size="16" fill="#334155">has scope to review</text>
<rect x="890" y="925" width="465" height="102" rx="8" fill="#edf5f5" stroke="#3f6d73" stroke-width="2"/>
<text x="1122.5" y="953" text-anchor="middle" font-size="18" font-weight="700">N12 · Inspection-window context</text>
<text x="1122.5" y="977" text-anchor="middle" font-size="16" font-weight="400">START_DTT / END_DTT</text>
<text x="1122.5" y="1001" text-anchor="middle" font-size="16" font-weight="400">Dates can be missing</text>
<path d="M860,652 L900,652 L900,880 L870,880 L870,977 L890,977" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1115" y="893" text-anchor="middle" font-size="16" fill="#334155">activity has window context</text>
<text x="540" y="1120" font-size="16">Full node/edge tables retain sources and questions for every statement.</text>
<rect x="45" y="1150" width="1310" height="80" rx="8" fill="#fff8e7" stroke="#986b1b" stroke-width="2" stroke-dasharray="8 5"/>
<text x="700.0" y="1178" text-anchor="middle" font-size="18" font-weight="700">N14 · Conservation Unit relationship to investigate</text>
<text x="700.0" y="1202" text-anchor="middle" font-size="16" font-weight="400">No CU field or membership crosswalk in this slice. No assignment edge is asserted.</text>
</g></svg>
